# 招待リンクによるセルフ登録フロー（Issue #21）。
# 公式example blueprint「flows-invitation-enrollment-minimal.yaml」を土台に、
# 入力項目を「氏名」「パスワード」「パスワード（確認）」の3つだけに絞ったもの。
#
# 入力フォームではメールアドレスを収集しない（外部通信なしの方針。確認メールを送る仕組み自体が無いため）。
# ただしOutline等一部のOIDC Relying Partyはid_tokenにemailクレームを必須とするため、
# 実在しないダミーのメールアドレス（<username>@chienami.invalid）をExpression Policyで自動生成し、
# User.email に格納する（ユーザーには一切見せない・入力させない）。
#
# ログインIDにあたる username は、入力された氏名をそのまま使う（重複時のみ連番を付与）。
# authentikのusernameフィールドはUnicode文字を許容するため、日本語の氏名でも問題ない。
#
# 実際に配布する「招待リンク」自体は、このBlueprintでは作成しない。
# 管理画面 Directory > Invitations > Create で、このFlow（名前: 研究室メンバー登録）を
# 指定して発行する（docs/design/authentik-setup.md 参照）。
version: 1
metadata:
  name: 招待制セルフ登録（氏名+パスワードのみ）
entries:
  - identifiers:
      slug: chienami-invite-enrollment
    model: authentik_flows.flow
    id: flow
    attrs:
      name: 研究室メンバー登録
      title: Chienami 研究室メンバー登録
      designation: enrollment
      authentication: require_unauthenticated

  - identifiers:
      name: chienami-invitation-stage
    id: invitation-stage
    model: authentik_stages_invitation.invitationstage
    attrs:
      # 招待リンクなしでのアクセスは登録に進ませない。
      continue_flow_without_invitation: false

  - identifiers:
      name: chienami-username-from-name
    id: policy-username-from-name
    model: authentik_policies_expression.expressionpolicy
    attrs:
      expression: |
        from authentik.core.models import User

        name = (context["prompt_data"].get("name") or "").strip()
        if not name:
            return False

        username = name
        suffix = 1
        while User.objects.filter(username=username).exists():
            suffix += 1
            username = f"{name}{suffix}"

        context["prompt_data"]["username"] = username

        # OutlineなどOIDCの一部Relying Partyはid_tokenにemailクレームを必須とするため、
        # 実在しないダミーのメールアドレスを割り当てる。
        # ".invalid" はRFC 2606で「実在しないことが保証されたドメイン」として予約されており、
        # 実際にメールが届く/届いてしまう心配がない。
        context["prompt_data"]["email"] = f"{username}@chienami.invalid"
        return True

  - identifiers:
      name: chienami-enrollment-field-name
    id: prompt-field-name
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: name
      label: 氏名
      type: text
      required: true
      placeholder: 氏名
      placeholder_expression: false
      order: 0

  - identifiers:
      name: chienami-enrollment-field-password
    id: prompt-field-password
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password
      label: パスワード
      type: password
      required: true
      placeholder: パスワード
      placeholder_expression: false
      order: 1

  - identifiers:
      name: chienami-enrollment-field-password-repeat
    id: prompt-field-password-repeat
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password_repeat
      label: パスワード（確認）
      type: password
      required: true
      placeholder: パスワード（確認）
      placeholder_expression: false
      order: 2

  - identifiers:
      name: chienami-enrollment-prompt-stage
    id: prompt-stage
    model: authentik_stages_prompt.promptstage
    attrs:
      fields:
        - !KeyOf prompt-field-name
        - !KeyOf prompt-field-password
        - !KeyOf prompt-field-password-repeat
      # 氏名の入力後、氏名からusernameを生成するポリシーを実行する。
      validation_policies:
        - !KeyOf policy-username-from-name

  - identifiers:
      name: chienami-enrollment-user-write
    id: user-write-stage
    model: authentik_stages_user_write.userwritestage
    attrs:
      user_creation_mode: always_create
      user_type: internal
      user_path_template: users/internal

  - identifiers:
      name: chienami-enrollment-user-login
    id: user-login-stage
    model: authentik_stages_user_login.userloginstage

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf invitation-stage
      order: 5
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf prompt-stage
      order: 10
    model: authentik_flows.flowstagebinding

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-write-stage
      order: 20
    model: authentik_flows.flowstagebinding

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-login-stage
      order: 100
    model: authentik_flows.flowstagebinding
