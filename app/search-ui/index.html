<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="サイドバー">
      <div class="sidebar-header">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path
              fill="currentColor"
              d="M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2zm-2 18a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-1h-4v1z"
            />
          </svg>
        </span>
        <span class="logo-text">Chienami</span>
      </div>

      <div class="sidebar-top-action">
        <button id="new-chat-btn" type="button" class="btn-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M11 5a1 1 0 0 1 2 0v6h6a1 1 0 0 1 0 2h-6v6a1 1 0 0 1-2 0v-6H5a1 1 0 0 1 0-2h6V5z" />
          </svg>
          <span>新しいチャット</span>
        </button>
      </div>

      <div class="sidebar-section-label">履歴</div>
      <ul id="conv-list" class="sidebar-list"></ul>

      <div class="sidebar-footer">
        <nav class="sidebar-nav" aria-label="ナビゲーション">
          <button type="button" class="nav-link" data-mode="ai">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"
              />
            </svg>
            <span>AI回答</span>
          </button>
          <button type="button" class="nav-link" data-mode="search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M21.71 20.29l-5.4-5.39A8 8 0 1 0 14.9 16.3l5.39 5.4a1 1 0 0 0 1.42-1.41zM4 10a6 6 0 1 1 6 6 6 6 0 0 1-6-6z"
              />
            </svg>
            <span>検索</span>
          </button>
          <a class="nav-link" href="https://knowledge.lab.local/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM8 12h8v2H8v-2zm0 4h8v2H8v-2z"
              />
            </svg>
            <span>Outline</span>
          </a>
          <a class="nav-link" href="/">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z" />
            </svg>
            <span>ポータル</span>
          </a>
        </nav>
      </div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

    <main class="main-area">
      <button id="menu-btn" type="button" class="hamburger" aria-label="メニューを開く" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
        </svg>
      </button>

      <div id="chat-scroll" class="chat-scroll">
        <div id="thread" class="chat-thread" aria-live="polite"></div>
      </div>

      <div class="chat-input-dock">
        <form id="chat-form" class="chat-input-inner" autocomplete="off">
          <textarea
            id="chat-input"
            class="chat-input"
            name="q"
            rows="1"
            placeholder="研究室の知識について質問する"
            aria-label="入力"
            autofocus
          ></textarea>
          <button id="send-btn" type="submit" class="send-btn" aria-label="送信">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M12 4l7 7-1.41 1.41L13 7.83V20h-2V7.83l-4.59 4.58L5 11l7-7z" />
            </svg>
          </button>
        </form>
        <p id="input-note" class="input-note"></p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
