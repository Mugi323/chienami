<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chienami</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="main">
    <header class="hero">
      <h1 class="logo">
        <img src="logo.png" alt="Chienami" width="841" height="272" />
      </h1>
      <p class="tagline">研究室のノウハウを蓄積・共有する知識基盤</p>
    </header>

    <nav class="cards" aria-label="アプリ一覧">
      <a class="card" href="https://search.lab.local/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"
            />
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Chienami Search</span>
          <span class="card-desc">研究室の知識をAIに質問・検索する</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M13.17 5.76l6.24 6.24-6.24 6.24-1.41-1.41L15.59 13H4v-2h11.59l-3.83-3.83 1.41-1.41z" />
          </svg>
        </span>
      </a>

      <a class="card" href="https://knowledge.lab.local/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM8 12h8v2H8v-2zm0 4h8v2H8v-2z"
            />
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Outline</span>
          <span class="card-desc">研究室の知識を蓄積・閲覧する</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M13.17 5.76l6.24 6.24-6.24 6.24-1.41-1.41L15.59 13H4v-2h11.59l-3.83-3.83 1.41-1.41z" />
          </svg>
        </span>
      </a>
    </nav>
  </main>
</body>
</html>
