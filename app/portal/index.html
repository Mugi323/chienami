<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chienami</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="main">
    <h1 class="title">Chienami</h1>
    <p class="subtitle">開きたい画面を選んでください</p>

    <div class="cards">
      <a class="card" href="https://knowledge.lab.local/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <path
              fill="currentColor"
              d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5a2.5 2.5 0 0 0 0 5H20v2H6.5A4.5 4.5 0 0 1 2 21.5v-15A2.5 2.5 0 0 1 4 4.5zM6.5 4A.5.5 0 0 0 6 4.5V17h13V4H6.5z"
            />
          </svg>
        </span>
        <span class="card-title">Outline</span>
        <span class="card-desc">研究室の知識を蓄積・閲覧する</span>
      </a>

      <a class="card" href="https://search.lab.local/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <path
              fill="currentColor"
              d="M21.71 20.29l-5.4-5.39A8 8 0 1 0 14.9 16.3l5.39 5.4a1 1 0 0 0 1.42-1.41zM4 10a6 6 0 1 1 6 6 6 6 0 0 1-6-6z"
            />
          </svg>
        </span>
        <span class="card-title">Chienami Search</span>
        <span class="card-desc">研究室の知識を検索する</span>
      </a>
    </div>
  </main>
