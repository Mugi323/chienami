services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:1.10.0
    restart: unless-stopped
    env_file: ./config/docker.env
    expose:
      # Reverse Proxy（Issue #14）経由のみでアクセスさせる。ホストへは公開しない。
      - "3000"
    volumes:
      - storage-data:/var/lib/outline/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: ./config/docker.env
    expose:
      - "5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "outline", "-U", "outline"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3

  # --- Authentik（ローカル認証基盤, Issue #21） ---
  # OutlineのログインをOIDC経由で行うためのセルフホストIdP。外部OIDCは使用せず、
  # Docker内部ネットワークに閉じて動作させる（研究データを外部クラウドへ送らない方針）。
  # authentik-postgres / authentik-server / authentik-worker は専用の
  # config/authentik.env を使う（docker.envと同じ変数名(POSTGRES_DB等)を
  # 別の値で必要とするため、1ファイル共有にすると値が衝突する）。
  authentik-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./config/authentik.env
    expose:
      - "5432"
    volumes:
      - authentik-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 20s
      retries: 3

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.1
    restart: unless-stopped
    command: server
    env_file: ./config/authentik.env
    expose:
      # Reverse Proxy（Issue #14）経由のみでアクセスさせる。ホストへは公開しない。
      - "9000"
    volumes:
      - authentik-data:/data
      # 日本語化・招待制セルフ登録フロー等をコードとして管理するBlueprint（読み取り専用）。
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.1
    restart: unless-stopped
    command: worker
    env_file: ./config/authentik.env
    # 注: 公式compose.ymlはoutpost管理用にホストの/var/run/docker.sockをworkerへマウントするが、
    # 本構成では組み込みoutpost（Outline連携）のみを使うため、権限最小化のためマウントしない。
    volumes:
      - authentik-data:/data
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy

  # --- Reverse Proxy（研究室LAN内アクセス, Issue #14 / HTTPS化, Issue #26） ---
  # knowledge.lab.local -> Outline、auth.lab.local -> Authentik へルーティングする。
  # Caddy内部CAでHTTPS化し、80番はHTTPSへのリダイレクト専用（自動HTTPS機能）として使う。
  # ホストのファイアウォールでLAN外からの80/443番アクセスを遮断すること
  # （研究室LANからのみ許可、docs/design/reverse-proxy-setup.md参照）。
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - outline
      - authentik-server

volumes:
  storage-data:
  database-data:
  authentik-database-data:
  authentik-data:
  caddy-data:
