services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:1.10.0
    restart: unless-stopped
    env_file: ./config/docker.env
    expose:
      # Reverse Proxy（Issue #14）経由のみでアクセスさせる。ホストへは公開しない。
      - "3000"
    volumes:
      - storage-data:/var/lib/outline/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: ./config/docker.env
    expose:
      - "5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "outline", "-U", "outline"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3

  # --- Authentik（ローカル認証基盤, Issue #21） ---
  # OutlineのログインをOIDC経由で行うためのセルフホストIdP。外部OIDCは使用せず、
  # Docker内部ネットワークに閉じて動作させる（研究データを外部クラウドへ送らない方針）。
  # authentik-postgres / authentik-server / authentik-worker は専用の
  # config/authentik.env を使う（docker.envと同じ変数名(POSTGRES_DB等)を
  # 別の値で必要とするため、1ファイル共有にすると値が衝突する）。
  authentik-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./config/authentik.env
    expose:
      - "5432"
    volumes:
      - authentik-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 20s
      retries: 3

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.1
    restart: unless-stopped
    command: server
    env_file: ./config/authentik.env
    expose:
      # Reverse Proxy（Issue #14）経由のみでアクセスさせる。ホストへは公開しない。
      - "9000"
    volumes:
      - authentik-data:/data
      # 日本語化・招待制セルフ登録フロー等をコードとして管理するBlueprint（読み取り専用）。
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.1
    restart: unless-stopped
    command: worker
    env_file: ./config/authentik.env
    # 注: 公式compose.ymlはoutpost管理用にホストの/var/run/docker.sockをworkerへマウントするが、
    # 本構成では組み込みoutpost（Outline連携）のみを使うため、権限最小化のためマウントしない。
    volumes:
      - authentik-data:/data
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy

  # --- Qdrant（Phase 3検索用ベクトルDB, Issue #30） ---
  # セマンティック検索用のチャンク・Embedding・metadataを保存する。原本ではないため
  # 索引を全削除してもOutlineから再構築できる（design書4.3節）。既定では認証が無効なため
  # APIキー必須化し、Docker内部ネットワークに閉じる（ホストへポートpublishしない）。
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    env_file: ./config/docker.env
    expose:
      - "6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --- Embedding（Phase 3, Issue #30） ---
  # text-embeddings-inference（TEI）でQwen3-Embedding-0.6Bを配信する。CPU版イメージを採用し、
  # GPUを必須要件にしない（design書9節）。モデル重みはnamed volumeへキャッシュし再ダウンロードを避ける。
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    restart: unless-stopped
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B"]
    expose:
      - "80"
    volumes:
      - embedding-model-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # --- chienami-indexer（Phase 3, Issue #32） ---
  # Outlineの「全員閲覧可Collection」の公開済み文書を定期的にEmbeddingし、Qdrantへ格納する
  # バックグラウンドプロセス（design書5.1節）。他サービスへ何も公開しないため expose/ports は無し。
  indexer:
    build:
      context: ./indexer
    restart: unless-stopped
    env_file: ./config/docker.env
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      outline:
        condition: service_started

  # --- chienami-api（Phase 3検索API, Issue #34） ---
  # クエリをEmbeddingしQdrantから検索するAPI。ブラウザ向けUI・Reverse Proxyでの外部公開は
  # Issue #4（検索UI）で行うため、本サービスは内部ネットワークのみ（ポートpublishなし）。
  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file: ./config/docker.env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy

  # --- chienami-eval（Phase 3検索評価ツール, Issue #38） ---
  # chienami-apiへ質問を投げてRecall@k/MRRを計測するオンデマンドツール。常駐サービスではない
  # ため profiles で通常の `docker compose up -d` には含めず、`docker compose run --rm eval`
  # で明示的に実行する（詳細: docs/design/search-eval-setup.md）。
  eval:
    build:
      context: ./eval
    profiles:
      - tools
    env_file: ./config/docker.env
    volumes:
      - ./eval/questions.yaml:/app/questions.yaml:ro

  # --- Reverse Proxy（研究室LAN内アクセス, Issue #14 / HTTPS化, Issue #26） ---
  # knowledge.lab.local -> Outline、auth.lab.local -> Authentik、
  # search.lab.local -> Chienami Search（静的UI + /api/* を chienami-api へ, Issue #36）、
  # portal.lab.local -> Chienami ポータル（Outline/Search選択画面, Issue #40）
  # へルーティングする。Caddy内部CAでHTTPS化し、80番はHTTPSへのリダイレクト専用
  # （自動HTTPS機能）として使う。ホストのファイアウォールでLAN外からの80/443番アクセスを
  # 遮断すること（研究室LANからのみ許可、docs/design/reverse-proxy-setup.md参照）。
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./search-ui:/srv/search-ui:ro
      - ./portal:/srv/portal:ro
      - caddy-data:/data
    depends_on:
      - outline
      - authentik-server
      - api

volumes:
  storage-data:
  database-data:
  authentik-database-data:
  authentik-data:
  caddy-data:
  qdrant-data:
  embedding-model-cache:
